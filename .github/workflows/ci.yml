name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate distributable knowledge base
        run: python3 scripts/check.py
      - name: Run retrieval CLI tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test skill metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("skills/ontology-chat/SKILL.md").read_text()
          assert text.startswith("---\n")
          front = text.split("---", 2)[1]
          assert "name: ontology-chat" in front
          assert "description:" in front
          print("Skill metadata present")
          PY
